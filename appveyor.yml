version: 1.0.{build}
image: Visual Studio 2022

branches:
  except:
    - coverity_scan

# the tools only: they detect the client version at runtime, the server versions build on GitHub
environment:
  OPENSSL_ROOT_DIR: C:\OpenSSL-v32-Win64

platform:
  - x64

configuration: Release

init:
  - cmd: cmake --version
  - cmd: msbuild /version

install:
  - git submodule update --init --recursive --depth 1

before_build:
  - cmd: echo %Image%
  - cmd: echo %Configuration%

build_script:
  - cmd: mkdir ascemu_build
  - cmd: cd ascemu_build
  - cmd: cmake ../ -G "Visual Studio 17 2022" -A %Platform% -DBUILD_WITH_WARNINGS=1 -DCMAKE_BUILD_TYPE=%CONFIGURATION% -DBUILD_TOOLS=1
  - cmd: msbuild src\tools\map_extractor\map_extractor.vcxproj /m /v:m /p:Configuration=%CONFIGURATION% /p:Platform=%Platform% /p:WarningLevel=4
  - cmd: msbuild src\tools\vmap_tools\vmap4_extractor\vmap4_extractor.vcxproj /m /v:m /p:Configuration=%CONFIGURATION% /p:Platform=%Platform% /p:WarningLevel=4
  - cmd: msbuild src\tools\vmap_tools\vmap4_assembler\vmap4_assembler.vcxproj /m /v:m /p:Configuration=%CONFIGURATION% /p:Platform=%Platform% /p:WarningLevel=4
  - cmd: msbuild src\tools\mmaps_generator\mmaps_generator.vcxproj /m /v:m /p:Configuration=%CONFIGURATION% /p:Platform=%Platform% /p:WarningLevel=4
  - cmd: msbuild src\tools\connection\connection_patcher.vcxproj /m /v:m /p:Configuration=%CONFIGURATION% /p:Platform=%Platform% /p:WarningLevel=4
