version: 1.0.{build}
image: Visual Studio 2026

branches:
  except:
    - coverity_scan

environment:
  matrix:
  - ASC_VERSION: Classic
  - ASC_VERSION: TBC
  - ASC_VERSION: WotLK
  - ASC_VERSION: Cata
  - ASC_VERSION: Mop
platform:
  - x64

configuration: Release

# Caches the build directory and chocolatey tools. Resets if appveyor.yml changes.
cache:
  - ascemu_build -> appveyor.yml
  - C:\ProgramData\chocolatey\bin -> appveyor.yml
  - C:\ProgramData\chocolatey\lib -> appveyor.yml

init:
  # Upgrade CMake to the latest version via Chocolatey
  - cmd: choco upgrade cmake -y
  # Automatically detect the latest pre-installed OpenSSL 3.x 64-bit directory
  - ps: $sslDir = (Get-ChildItem C:\ -Filter "OpenSSL-v*Win64" | Sort-Object Name -Descending | Select-Object -First 1).FullName
  - ps: Set-AppveyorBuildVariable -Name "OPENSSL_ROOT_DIR" -Value $sslDir
  # Verify versions
  - cmd: '"C:\Program Files\CMake\bin\cmake.exe" --version'
  - cmd: msbuild /version

install:
  - git submodule update --init --recursive --depth 1

before_build:
  - cmd: echo %Image%
  - cmd: echo %Configuration%

build_script:
  # Modern CMake: -S specifies the source root, -B the build directory
  - cmd: '"C:\Program Files\CMake\bin\cmake.exe" -S . -B ascemu_build -G "Visual Studio 18 2026" -A %Platform% -DCMAKE_BUILD_TYPE=%CONFIGURATION% -DBUILD_TOOLS=1 -DASCEMU_VERSION=%ASC_VERSION%'
  # Let CMake find and build the solution automatically, passing custom flags after '--' (use maximum cpu cores (/m) and use /p:WarningLevel=3)
  - cmd: '"C:\Program Files\CMake\bin\cmake.exe" --build ascemu_build --config %CONFIGURATION% -- /m /p:MultiProcessorCompilation=true /p:WarningLevel=3 /p:TreatWarningsAsErrors=true'
